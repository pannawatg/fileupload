<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub File Storage</title>
</head>
<body>
  <form id="uploadForm">
    <!--Token-->
    <input 
      type="password" 
      id="githubToken" 
      placeholder="Paste GitHub Token here..." 
      autocomplete="off" 
      spellcheck="false" 
      required 
    />
    <br><br>    
    <!--File Input-->
    <input type="file" id="inputFile" name="myfile" required />
    <button type="submit">Upload</button>
  </form>
  
  <p id="status"></p>
  <script src="script.js"></script>
</body>
</html>
